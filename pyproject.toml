[project]
name = "catholic-knowledge-base"
version = "0.1.0"
description = "Tools to collect and validate Catholic primary-source texts"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
